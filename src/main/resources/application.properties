# AI Provider
application.ai.provider=ollama
application.ai.memory.max-messages=20

# Ollama
application.ollama.url=http://localhost:11434/api/chat
application.ollama.model=llama3.2:3b

# OpenAI (keep for later)
application.openai.url=https://api.openai.com/v1/chat/completions
application.openai.key=${OPENAI_API_KEY}

spring.datasource.url=jdbc:postgresql://localhost:5432/aiassistant
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true